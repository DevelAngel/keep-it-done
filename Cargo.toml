[workspace]
resolver = "3"
members = ["cli", "server"]

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.1.0"
authors = ["Angelos Drossos"]
keywords = ["tasks"]
license-file = "LICENSE"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = { version = "1.0.100", features = ["backtrace"] }
clap = { version = "4.5.54", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }
futures = "0.3.31"
rand = "0.9.2"
serde = "1.0.228"
tarpc = "0.37.0"
tokio = "1.40.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = "1.19.0"
