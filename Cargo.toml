[workspace]
resolver = "3"
members = ["cli", "frontend", "server"]

# need to be applied only to wasm build
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.1.0"
authors = ["Angelos Drossos"]
keywords = ["tasks"]
license-file = "LICENSE"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = { version = "1.0.100", features = ["backtrace"] }
axum = "0.8.4"
cfg-if = "1.0.0"
clap = { version = "4.5.54", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
futures = "0.3.31"
http = "1.3.1"
indexmap = "2.13.0"
leptos = { version = "0.8.2" }
leptos_meta = { version = "0.8.2" }
leptos_router = { version = "0.8.2" }
leptos_axum = { version = "0.8.2" }
rand = "0.9.2"
serde = "1.0.228"
tarpc = "0.37.0"
thiserror = "2.0.12"
tokio = "1.40.0"
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.4", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
uuid = "1.19.0"
wasm-bindgen = "0.2.106"

[[workspace.metadata.leptos]]
name = "kid"
bin-package = "kid-server"
lib-package = "kid-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
watch = false
env = "DEV"
tailwind-input-file = "style/tailwind.css"
