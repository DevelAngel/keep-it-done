[package]
name = "kid-types"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
rpc = ["dep:tarpc"]
cli = [
  "rpc",
  "dep:schemars",
  "dep:clap"
]
ssr = [
  "rpc",
  "uuid/rng-rand",
  "uuid/v7",
  "dep:ahash",
  "dep:miette",
  "dep:tokio",
  "dep:serde_json",
]
ssr-test-rand = ["dep:rand"]
ssr-test-storagefail = []

[dependencies.kid-types-derive]
path = "derive"

[dependencies]
ahash = { workspace = true, optional = true }
cfg-if.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
chrono = { workspace = true, features = ["now", "std", "serde"] }
derive_more = { workspace = true, features = ["display"] }
indexmap = { workspace = true, features = ["serde"] }
miette = { workspace = true, features = ["fancy-no-syscall"], optional = true }
rand = { workspace = true, optional = true }
schemars = { workspace = true, features = ["std", "derive", "chrono04", "preserve_order"], optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["indexmap", "preserve_order"], optional = true }
serde_with.workspace = true
strum.workspace = true
tarpc = { workspace = true, features = ["serde1"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"], optional = true }
tracing.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
assert_fs.workspace = true
predicates.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
tracing-test.workspace = true
